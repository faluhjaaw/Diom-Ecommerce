apiVersion: v1
kind: ConfigMap
metadata:
  name: diom-config
  namespace: diom
data:
  # MongoDB
  MONGODB_URI: "mongodb://mongodb:27017"
  MONGODB_DB: "transversaleProducts"

  # MySQL
  MYSQL_URL: "jdbc:mysql://mysql:3306/trans_customer?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"

  # Redis
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # Kafka
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_ENABLED: "true"

  # Eureka
  EUREKA_URI: "http://discovery-service:8761/eureka"
  EUREKA_SERVER: "http://discovery-service:8761/eureka"

  # Qdrant
  QDRANT_HOST: "qdrant"
  QDRANT_PORT: "6333"

  # Ollama
  OLLAMA_BASE_URL: "http://ollama:11434"

  # Inter-service URLs
  CUSTOMER_SERVICE_URL: "http://customer-service:8083"
  PRODUCT_SERVICE_URL: "http://product-service:8082"
  SEARCH_SERVICE_URL: "http://search-service:8088"
  RECOMMENDATION_SERVICE_URL: "http://recommendation-service:8090"

  # CORS — set to frontend external IP after first deploy
  # Example: FRONTEND_URL: "http://34.90.12.45"
  FRONTEND_URL: "http://localhost:5173"
