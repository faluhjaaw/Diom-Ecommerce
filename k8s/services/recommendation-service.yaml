apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
  namespace: diom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendation-service
  template:
    metadata:
      labels:
        app: recommendation-service
    spec:
      containers:
        - name: recommendation-service
          image: us-central1-docker.pkg.dev/PROJECT_ID/diom-repo/recommendation-service:latest
          ports:
            - containerPort: 8090
          env:
            - name: mongo_uri
              valueFrom:
                configMapKeyRef:
                  name: diom-config
                  key: MONGODB_URI
            - name: mongo_db
              value: "transversaleRecommendations"
            - name: qdrant_host
              valueFrom:
                configMapKeyRef:
                  name: diom-config
                  key: QDRANT_HOST
            - name: qdrant_port
              valueFrom:
                configMapKeyRef:
                  name: diom-config
                  key: QDRANT_PORT
            - name: redis_host
              valueFrom:
                configMapKeyRef:
                  name: diom-config
                  key: REDIS_HOST
            - name: redis_port
              valueFrom:
                configMapKeyRef:
                  name: diom-config
                  key: REDIS_PORT
            - name: kafka_bootstrap_servers
              valueFrom:
                configMapKeyRef:
                  name: diom-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: kafka_enabled
              valueFrom:
                configMapKeyRef:
                  name: diom-config
                  key: KAFKA_ENABLED
            - name: eureka_enabled
              value: "true"
            - name: eureka_server
              valueFrom:
                configMapKeyRef:
                  name: diom-config
                  key: EUREKA_SERVER
            - name: eureka_instance_host
              value: "recommendation-service"
            - name: product_service_url
              valueFrom:
                configMapKeyRef:
                  name: diom-config
                  key: PRODUCT_SERVICE_URL
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "3Gi"
              cpu: "2000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-service
  namespace: diom
spec:
  selector:
    app: recommendation-service
  ports:
    - port: 8090
      targetPort: 8090
