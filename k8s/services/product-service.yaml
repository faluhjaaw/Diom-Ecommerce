apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: diom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: us-central1-docker.pkg.dev/PROJECT_ID/diom-repo/product-service:latest
          ports:
            - containerPort: 8082
          env:
            - name: PORT
              value: "8082"
            - name: MONGODB_URI
              value: "mongodb://mongodb:27017/transversaleProducts"
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: diom-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: CUSTOMER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: diom-config
                  key: CUSTOMER_SERVICE_URL
            - name: EUREKA_URI
              valueFrom:
                configMapKeyRef:
                  name: diom-config
                  key: EUREKA_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: diom-secrets
                  key: jwt-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: diom
spec:
  selector:
    app: product-service
  ports:
    - port: 8082
      targetPort: 8082
