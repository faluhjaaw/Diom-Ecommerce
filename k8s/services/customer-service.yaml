apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: diom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
    spec:
      containers:
        - name: customer-service
          image: us-central1-docker.pkg.dev/PROJECT_ID/diom-repo/customer-service:latest
          ports:
            - containerPort: 8083
          env:
            - name: PORT
              value: "8083"
            - name: MYSQL_URL
              valueFrom:
                configMapKeyRef:
                  name: diom-config
                  key: MYSQL_URL
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: diom-secrets
                  key: mysql-user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: diom-secrets
                  key: mysql-password
            - name: EUREKA_URI
              valueFrom:
                configMapKeyRef:
                  name: diom-config
                  key: EUREKA_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: diom-secrets
                  key: jwt-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
  namespace: diom
spec:
  selector:
    app: customer-service
  ports:
    - port: 8083
      targetPort: 8083
