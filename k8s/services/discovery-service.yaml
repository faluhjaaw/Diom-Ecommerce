# Deploy FIRST — all other services depend on Eureka
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
  namespace: diom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-service
  template:
    metadata:
      labels:
        app: discovery-service
    spec:
      containers:
        - name: discovery-service
          image: us-central1-docker.pkg.dev/PROJECT_ID/diom-repo/discovery-service:latest
          ports:
            - containerPort: 8761
          env:
            - name: PORT
              value: "8761"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 60
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-service
  namespace: diom
spec:
  selector:
    app: discovery-service
  ports:
    - port: 8761
      targetPort: 8761
