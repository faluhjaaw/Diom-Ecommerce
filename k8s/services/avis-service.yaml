apiVersion: apps/v1
kind: Deployment
metadata:
  name: avis-service
  namespace: diom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: avis-service
  template:
    metadata:
      labels:
        app: avis-service
    spec:
      containers:
        - name: avis-service
          image: us-central1-docker.pkg.dev/PROJECT_ID/diom-repo/avis-service:latest
          ports:
            - containerPort: 8086
          env:
            - name: PORT
              value: "8086"
            - name: MONGODB_URI
              value: "mongodb://mongodb:27017/transversaleAvis"
            - name: EUREKA_URI
              valueFrom:
                configMapKeyRef:
                  name: diom-config
                  key: EUREKA_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: diom-secrets
                  key: jwt-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 60
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: avis-service
  namespace: diom
spec:
  selector:
    app: avis-service
  ports:
    - port: 8086
      targetPort: 8086
