apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: diom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: us-central1-docker.pkg.dev/PROJECT_ID/diom-repo/auth-service:latest
          ports:
            - containerPort: 8081
          env:
            - name: PORT
              value: "8081"
            - name: MONGODB_URI
              valueFrom:
                configMapKeyRef:
                  name: diom-config
                  key: MONGODB_URI
            - name: EUREKA_URI
              valueFrom:
                configMapKeyRef:
                  name: diom-config
                  key: EUREKA_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: diom-secrets
                  key: jwt-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: diom
spec:
  selector:
    app: auth-service
  ports:
    - port: 8081
      targetPort: 8081
