# IMPORTANT: Replace base64 values before applying
# Generate: echo -n "value" | base64
# Apply: kubectl apply -f secrets.yaml -n diom
apiVersion: v1
kind: Secret
metadata:
  name: diom-secrets
  namespace: diom
type: Opaque
data:
  # echo -n "ECommerceSecret123" | base64
  jwt-secret: RUNvbW1lcmNlU2VjcmV0MTIz
  # echo -n "pppp" | base64
  mysql-password: cHBwcA==
  # echo -n "root" | base64
  mysql-user: cm9vdA==
  # Replace with your real Anthropic API key | base64
  anthropic-api-key: REPLACE_WITH_BASE64_API_KEY
