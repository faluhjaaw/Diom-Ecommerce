services:

  # ─────────────────────────────────────────
  # INFRASTRUCTURE
  # ─────────────────────────────────────────

  mongodb:
    image: mongo:7.0
    container_name: proj-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: transversaleCommerce
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    container_name: proj-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: pppp
      MYSQL_DATABASE: trans_customer
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppppp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: proj-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: proj-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: proj-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: proj-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # ─────────────────────────────────────────
  # SERVICES JAVA — SPRING BOOT
  # ─────────────────────────────────────────

  discovery-service:
    build: ./discovery-service
    container_name: proj-discovery
    restart: unless-stopped
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/eureka/apps || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  gateway-service:
    build: ./gateway-service
    container_name: proj-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      discovery-service:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka

  auth-service:
    build: ./auth-service
    container_name: proj-auth
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      discovery-service:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      EUREKA_URI: http://discovery-service:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/trans_customer
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: pppp

  customer-service:
    build: ./customer-service
    container_name: proj-customer
    restart: unless-stopped
    ports:
      - "8083:8083"
    depends_on:
      discovery-service:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      EUREKA_URI: http://discovery-service:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/trans_customer
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: pppp

  product-service:
    build: ./product-service
    container_name: proj-product
    restart: unless-stopped
    ports:
      - "8082:8082"
    depends_on:
      discovery-service:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      EUREKA_URI: http://discovery-service:8761/eureka
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/transversaleProducts
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  avis-service:
    build: ./avis-service
    container_name: proj-avis
    restart: unless-stopped
    ports:
      - "8086:8086"
    depends_on:
      discovery-service:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      EUREKA_URI: http://discovery-service:8761/eureka
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/transversaleAvis

  message-service:
    build: ./message-service
    container_name: proj-message
    restart: unless-stopped
    ports:
      - "8087:8087"
    depends_on:
      discovery-service:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      EUREKA_URI: http://discovery-service:8761/eureka
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/transversaleMessages

  # ─────────────────────────────────────────
  # SERVICES PYTHON — IA
  # ─────────────────────────────────────────

  search-service:
    build: ./search-service
    container_name: proj-search
    restart: unless-stopped
    ports:
      - "8088:8088"
    depends_on:
      discovery-service:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: transversaleProducts
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      redis_host: redis
      redis_port: 6379
      kafka_bootstrap_servers: kafka:29092
      kafka_enabled: "true"
      eureka_enabled: "true"
      eureka_server: http://discovery-service:8761/eureka
      eureka_instance_host: search-service

  recommendation-service:
    build: ./recommendation-service
    container_name: proj-recommendation
    restart: unless-stopped
    ports:
      - "8090:8090"
    depends_on:
      discovery-service:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      mongo_uri: mongodb://mongodb:27017
      mongo_db: transversaleRecommendations
      qdrant_host: qdrant
      qdrant_port: 6333
      redis_host: redis
      redis_port: 6379
      kafka_bootstrap_servers: kafka:29092
      kafka_enabled: "true"
      eureka_enabled: "true"
      eureka_server: http://discovery-service:8761/eureka
      eureka_instance_host: recommendation-service
      product_service_url: http://product-service:8082

volumes:
  mongodb_data:
  mysql_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  qdrant_data:
