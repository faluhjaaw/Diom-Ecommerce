spring.application.name=avis-service
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/transversaleAvis}
jwt.secret=${JWT_SECRET:ECommerceSecret123}

server.port=8086
spring.cloud.discovery.enabled=true
